name: Browser Schematron feasibility - synthetic only

on:
  pull_request:
    paths:
      - "scripts/probe-browser-schematron.mjs"
      - "src/export/**"
      - ".github/workflows/browser-schematron-feasibility.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xslt3:
    name: Official EN16931 Schematron via open-source XSLT3 candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Generate synthetic-only CII XML
        run: |
          set -euo pipefail
          npm ci
          CII_VALIDATION_OUTPUT="$RUNNER_TEMP/synthetic-cii.xml" \
            npm run test -- src/export/cii-candidate.test.ts
          test -s "$RUNNER_TEMP/synthetic-cii.xml"
      - name: Obtain exact official Schematron release from verified validator
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            --output "$RUNNER_TEMP/Mustang-CLI.jar" \
            https://repo.maven.apache.org/maven2/org/mustangproject/Mustang-CLI/2.26.0/Mustang-CLI-2.26.0.jar
          echo "42d7868cb68264874a7b8cab4c3587b03b23ccc7cd72373da917f66758bb9736  $RUNNER_TEMP/Mustang-CLI.jar" | \
            sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/schematron"
          unzip -qq -j "$RUNNER_TEMP/Mustang-CLI.jar" \
            "xslt/ZF_250/FACTUR-X_EN16931.xslt" \
            "xslt/ZF_250/FACTUR-X_EN16931_codedb.xml" \
            "xslt/en16931schematron/EN16931-CII-validation.xslt" \
            -d "$RUNNER_TEMP/schematron"
          test -s "$RUNNER_TEMP/schematron/FACTUR-X_EN16931.xslt"
          test -s "$RUNNER_TEMP/schematron/EN16931-CII-validation.xslt"
      - name: Probe BSD-licensed browser XSLT3 against official rules
        run: |
          set -euo pipefail
          # Isolated feasibility, not a runtime dependency and not a source
          # of user invoice data. XSLT 1.0 is insufficient for these rules.
          npm install --no-save --package-lock=false --ignore-scripts @tradik/xslt3@1.0.0
          node --max-old-space-size=768 scripts/probe-browser-schematron.mjs \
            "$RUNNER_TEMP/schematron" "$RUNNER_TEMP/synthetic-cii.xml"
