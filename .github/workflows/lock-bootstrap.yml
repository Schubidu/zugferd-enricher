name: Temporary lockfile bootstrap

on:
  push:
    branches: [feat/issue-1-foundation]

permissions:
  contents: write

jobs:
  generate:
    if: github.ref == 'refs/heads/feat/issue-1-foundation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Add generated lockfile on trusted feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: add resolved npm lockfile (#1)"
            git push origin HEAD:feat/issue-1-foundation
          fi
