name: Temporary reproducible Rust WASM build
on:
  push:
    branches:
      - feat/issue-3-local-classification-reconciliation
permissions:
  contents: write
jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Prepare exact Rust toolchain
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain 1.89.0
      - name: Lock dependencies, compile pure Rust WASM
        run: |
          cargo +1.89.0 generate-lockfile --manifest-path rust/invoice-classifier/Cargo.toml
          bash scripts/build-classifier-wasm.sh
          wc -c public/models/fasttext-rust-v1.wasm
      - name: Refresh npm lockfile without obsolete Emscripten package
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated static model runtime and lockfiles to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/models/fasttext-rust-v1.wasm rust/invoice-classifier/Cargo.lock package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(classifier): lock direct Rust-WASM asset and dependencies (#3)"
            git push origin HEAD:feat/issue-3-local-classification-reconciliation
          fi
