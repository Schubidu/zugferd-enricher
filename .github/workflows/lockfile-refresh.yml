name: One-time lockfile refresh
on:
  push:
    branches: [feat/issue-2-pdf-extraction]
permissions:
  contents: write
jobs:
  lockfile:
    if: github.ref == 'refs/heads/feat/issue-2-pdf-extraction'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit resolved npm lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: resolve Node type definitions"
            git push origin HEAD:feat/issue-2-pdf-extraction
          fi
