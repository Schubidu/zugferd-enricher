name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Audit report (diagnostic)
        run: |
          npm audit --json > audit.json || true
          node -e 'const r = require("node:fs").readFileSync("audit.json", "utf8"); const a = JSON.parse(r); for (const [name, v] of Object.entries(a.vulnerabilities || {})) if (v.severity === "critical" || v.severity === "high") console.log(JSON.stringify({name, severity:v.severity, isDirect:v.isDirect, via:v.via, fixAvailable:v.fixAvailable, range:v.range}));'
      - run: npm run check
