name: Temporary model and lockfile bootstrap
on:
  push:
    branches: [feat/issue-3-local-classification-reconciliation]
permissions:
  contents: write
jobs:
  generate:
    if: github.ref == 'refs/heads/feat/issue-3-local-classification-reconciliation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install fasttext-new==0.1.0
      - run: python scripts/train_fasttext.py
      - name: Commit generated quantized model and npm lockfile to trusted feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json public/models/invoice-categories-v1.ftz
          if ! git diff --cached --quiet; then
            git commit -m "chore: add locally trained quantized fastText model and lockfile (#3)"
            git push origin HEAD:feat/issue-3-local-classification-reconciliation
          fi
